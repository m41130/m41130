<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">m41130 profile banner</title>
  <desc id="description">A dark systems-inspired banner about building products across the USA, Europe, and Mainland China.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914" />
      <stop offset="0.55" stop-color="#0a1222" />
      <stop offset="1" stop-color="#10152a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" />
      <stop offset="0.5" stop-color="#60a5fa" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity="0.055" />
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#background)" stroke="#334155" stroke-opacity="0.7" />
  <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#grid)" />
  <circle cx="950" cy="164" r="230" fill="url(#glow)" />
  <path d="M64 67H250" stroke="url(#accent)" stroke-width="3" />

  <text x="64" y="54" class="mono" font-size="14" letter-spacing="3" fill="#94a3b8">PROFILE // M41130</text>
  <text x="64" y="145" class="sans" font-size="62" font-weight="760" fill="#f8fafc">building systems</text>
  <text x="66" y="195" class="sans" font-size="25" fill="#cbd5e1">until small ideas become entire platforms.</text>

  <g class="mono" font-size="13">
    <rect x="64" y="240" width="170" height="37" rx="18.5" fill="#0f766e" fill-opacity="0.19" stroke="#5eead4" stroke-opacity="0.42" />
    <text x="149" y="264" fill="#99f6e4" text-anchor="middle">PRODUCT SYSTEMS</text>
    <rect x="246" y="240" width="132" height="37" rx="18.5" fill="#1d4ed8" fill-opacity="0.17" stroke="#60a5fa" stroke-opacity="0.42" />
    <text x="312" y="264" fill="#bfdbfe" text-anchor="middle">APPLIED AI</text>
    <rect x="390" y="240" width="133" height="37" rx="18.5" fill="#6d28d9" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.42" />
    <text x="456.5" y="264" fill="#ddd6fe" text-anchor="middle">OPERATIONS</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-opacity="0.55" stroke-width="1.4">
    <path d="M805 121C864 73 972 70 1037 122" />
    <path d="M805 121C850 190 981 228 1081 190" />
    <path d="M1037 122C1054 144 1069 166 1081 190" />
  </g>
  <g filter="url(#softGlow)">
    <circle cx="805" cy="121" r="6" fill="#5eead4" />
    <circle cx="1037" cy="122" r="6" fill="#60a5fa" />
    <circle cx="1081" cy="190" r="6" fill="#a78bfa" />
  </g>
  <g class="mono" font-size="13" fill="#cbd5e1">
    <text x="777" y="100">USA</text>
    <text x="1004" y="100">EUROPE</text>
    <text x="968" y="220">MAINLAND CHINA</text>
  </g>
  <text x="801" y="274" class="mono" font-size="13" fill="#64748b">CROSS-MARKET DELIVERY</text>

  <g class="mono" font-size="12" fill="#64748b">
    <text x="64" y="323">architecture → implementation → deployment → operations</text>
    <text x="1135" y="323" text-anchor="end">reading / steiner</text>
  </g>
</svg>
